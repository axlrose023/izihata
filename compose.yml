name: izihata

services:
  app: &app
    build: ./backend
    restart: unless-stopped
    volumes:
      - ./backend/src:/app/src
      - media_data:/app/media
    ports:
      - "${API_HOST_PORT:-18000}:${APP__API__PORT}"
    env_file:
      - path: .env
        required: false
    environment:
      - APP__ENV=dev
      - APP__POSTGRES__HOST=db
      - APP__REDIS__HOST=cache
      - APP__API__ALLOWED_HOSTS=["app","localhost","127.0.0.1"]
      - APP__MEDIA_ROOT=/app/media
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:${APP__API__PORT}/health')\"" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      cache:
        condition: service_healthy
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      app:
        condition: service_healthy

  migrator:
    <<: *app
    command: [ cli, bootstrap ]
    restart: "no"
    ports: []
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    <<: *app
    command: [ taskiq, scheduler, "app.tiq:scheduler", "app.tasks" ]
    ports: []
    healthcheck:
      disable: true

  tasks:
    <<: *app
    command: [ taskiq, worker, "app.tiq:broker", -w, "4", "app.tasks" ]
    ports: []
    healthcheck:
      disable: true

  cache:
    image: eqalpha/keydb@sha256:6537505c42355ca1f571276bddf83f5b750f760f07b2a185a676481791e388ac # 6.3.4
    restart: unless-stopped
    volumes:
      - cache_data:/data
    ports:
      - "${CACHE_HOST_PORT:-6380}:6379"
    healthcheck:
      test: [ "CMD", "keydb-cli", "ping" ]
      interval: 5s
      timeout: 10s
      retries: 5

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${APP__POSTGRES__USER}
      POSTGRES_PASSWORD: ${APP__POSTGRES__PASSWORD}
      POSTGRES_DB: ${APP__POSTGRES__DB}
    volumes:
      - db_data:/var/lib/postgresql
    ports:
      - "${POSTGRES_HOST_PORT:-15433}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${APP__POSTGRES__USER}" ]
      interval: 5s
      timeout: 10s
      retries: 5

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.9.1
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      - app

  loki:
    profiles: ["observability"]
    image: grafana/loki:3.6.7
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    user: "root"

  promtail:
    profiles: ["observability"]
    image: grafana/promtail:3.6.7
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:12.4.0
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    depends_on:
      - prometheus
      - loki

volumes:
  db_data:
  cache_data:
  media_data:
  prometheus_data:
  grafana_data:
  loki_data:
