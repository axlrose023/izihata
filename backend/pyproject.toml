[project]
name = "izihata-api"
version = "0.1.0"
description = "Backend API for the IziHata electrical goods store"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.17.0",
    "asyncpg>=0.30.0",
    "dishka>=1.7.2",
    "fastapi>=0.119.1",
    "httpx>=0.28.1",
    "pyjwt>=2.9.0",
    "pydantic-settings>=2.11.0",
    "redis>=6.4.0",
    "sqlalchemy[asyncio]>=2.0.44",
    "taskiq>=0.11.18",
    "taskiq-redis>=1.1.2",
    "yarl>=1.22.0",
    "bcrypt>=4.2.1",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "typer>=0.20.0",
    "uvicorn[standard]>=0.38.0",
    "python-multipart>=0.0.32",
]

[project.scripts]
app = "app:main"
cli = "cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.21.0",
    "mypy>=1.18.0",
    "coverage>=7.0.0",
    "pre-commit>=3.7.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.6.0",
    "ruff>=0.14.1",
]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = "pydantic.mypy"

[tool.ruff]
target-version = "py313"
line-length = 88
lint.select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "ASYNC", # flake8-async
    "N",  # pep8-naming
    "RUF", # Ruff-specific rules
    "S",  # flake8-bandit
    "SIM", # flake8-simplify
]
lint.ignore = [
    "E501", # line too long, handled by black
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"permissions.py" = ["E501"]
"src/tests/**/*.py" = ["RUF001", "S101", "S105", "S106"]
"src/integration_tests/**/*.py" = ["S101"]
"src/app/api/modules/auth/schema.py" = ["S105"]
"src/app/settings.py" = ["S104"]
"src/cli/cli.py" = ["S603", "S607"]
# A table of Ukrainian product-name patterns: the Cyrillic is deliberate.
"src/app/database/imports/category_rules.py" = ["RUF001"]
