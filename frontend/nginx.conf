map $http_x_forwarded_proto $upstream_scheme {
    default $scheme;
    https https;
    http http;
}

server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $upstream_scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    location ~ /\. {
        return 404;
    }

    location = /sitemap.xml {
        rewrite ^ /api/v1/catalog/sitemap.xml last;
    }

    location /api/ {
        proxy_pass http://app:8000;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /product-images/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location = / {
        proxy_pass http://app:8000;
    }

    location ~ ^/(account(/login)?|admin(/(login|products|orders|leads|reviews|brands|activity|companies|custom-boards))?|advisors|custom-boards|checkout|favorites|compare|order/success)/?$ {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri @public_page;
    }

    location @public_page {
        proxy_pass http://app:8000;
    }
}
